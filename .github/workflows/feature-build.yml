name: Feature build

on:
  push:
    branches:
      - feat/9router-combo-priority
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Check formatting
        run: cargo fmt --check
      - name: Test priority script
        run: node tests/9router_priority.test.js
      - name: Test router priority
        run: cargo test --locked router_priority
      - name: Build release executable
        run: cargo build --release --locked
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-usage-monitor
          path: target/release/claude-code-usage-monitor.exe
